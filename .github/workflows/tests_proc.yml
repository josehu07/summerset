name: Proc tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests_proc:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        protocol: [
          RepNothing, SimplePush, ChainRep, MultiPaxos, EPaxos, RSPaxos,
          Raft, CRaft, Crossword, QuorumLeases, Bodega,
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Get apt dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Add rust stable toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Get uv for Python
      uses: astral-sh/setup-uv@v10.3.3

    - name: Run proc tests (${{ matrix.protocol }})
      run: uv run .github/workflow_test.py -p ${{ matrix.protocol }}
